# Plugin-only example scenario for battery fault injection.
#
# The battery_state injector type is provided by the external
# ros2_fault_injection_example_plugins package, not by this core package:
# https://github.com/reeceholland/ros2_fault_injection_example_plugins
injectors:
  - id: battery
    type: battery_state
    topic:
      input_topic: /battery_state_raw
      output_topic: /battery_state
      qos_depth: 10

faults:
  - id: battery_voltage_bias
    injector_id: battery
    active_on_startup: true
    config:
      voltage_bias: -1.5