# Example scenario for Twist command fault injection.
#
# The twist injector proxies geometry_msgs/msg/Twist from /cmd_vel_raw to
# /cmd_vel. Remap the command producer to /cmd_vel_raw, then let this injector
# publish the mutated command stream on /cmd_vel for the robot controller.
injectors:
  - id: cmd_vel
    type: twist
    topic:
      input_topic: /cmd_vel_raw
      output_topic: /cmd_vel
      qos_depth: 10

faults:
  # Drops roughly half of incoming velocity commands while active.
  # Valid range is 0.0 to 1.0.
  - id: cmd_vel_dropout
    injector_id: cmd_vel
    active_on_startup: false
    config:
      drop_probability: 0.5

  # Delays velocity commands by the configured number of milliseconds.
  - id: cmd_vel_delay
    injector_id: cmd_vel
    active_on_startup: false
    start: 5.0
    duration: 6.0
    config:
      delay_ms: 500

  # Replays the previous command for a short window instead of forwarding the
  # newest command. This is useful for stale-command safety testing.
  - id: cmd_vel_stale_replay
    injector_id: cmd_vel
    active_on_startup: false
    config:
      stale_replay_enabled: true
      stale_replay_duration_ms: 1000

  # Scales command magnitudes while active.
  - id: cmd_vel_scale
    injector_id: cmd_vel
    active_on_startup: false
    config:
      linear_x_scale: 0.5
      angular_z_scale: 1.5

  # Clamps command magnitudes symmetrically around zero.
  - id: cmd_vel_clamp
    injector_id: cmd_vel
    active_on_startup: false
    config:
      max_linear_x: 0.25
      max_angular_z: 0.5

  # Forces a zero command while active.
  - id: cmd_vel_force_stop
    injector_id: cmd_vel
    active_on_startup: false
    config:
      force_stop: true
