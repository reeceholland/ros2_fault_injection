injectors:
  - id: odom
    type: odom
    topic:
      input_topic: /odom_raw
      output_topic: /odom
      qos_depth: 10

  - id: cmd_vel
    type: twist
    topic:
      input_topic: /cmd_vel_smoothed
      output_topic: /cmd_vel_faulted
      qos_depth: 10

  - id: scan
    type: scan
    topic:
      input_topic: /scan_raw
      output_topic: /scan
      qos_depth: 10

faults:
  - id: cmd_vel_delay
    injector_id: cmd_vel
    active_on_startup: true
    config:
      delay_ms: 250

  - id: cmd_vel_dropout
    injector_id: cmd_vel
    active_on_startup: false
    config:
      drop_probability: 0.15

  - id: cmd_vel_scale
    injector_id: cmd_vel
    active_on_startup: false
    config:
      linear_x_scale: 0.8
      angular_z_scale: 0.8

  - id: odom_position_bias
    injector_id: odom
    active_on_startup: false
    config:
      x_bias: 0.25
      y_bias: 0.0

  - id: scan_dropout
    injector_id: scan
    active_on_startup: false
    config:
      drop_probability: 0.1

assertions:
  - id: odom_stays_above_5hz
    type: topic_hz
    topic: /odom
    message_type: nav_msgs/msg/Odometry
    min_hz: 5.0
    window: 3.0
    within: 8.0

  - id: keep_sim_bridge_active
    type: topic_hz
    topic: /__fault_injection_keepalive
    message_type: std_msgs/msg/Bool
    min_hz: 1.0
    window: 1.0
