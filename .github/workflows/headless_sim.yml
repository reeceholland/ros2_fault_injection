name: Headless Unity fault-injection test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DISTRO: jazzy

  # Current fault-injection checkout.
  # Deliberately NOT pinned.
  FAULT_INJECTION_WS: ${{ github.workspace }}

  # ------------------------------------------------------------
  # PINNED EXTERNAL DEPENDENCIES
  # ------------------------------------------------------------

  UNITY_TEST_REPO: https://github.com/reeceholland/unity-ros2-rover-sim.git
  UNITY_TEST_COMMIT: fe2a5bf2fb2f3910f94695750340051726605150

  ROVER_REPO: https://github.com/reeceholland/rugged_rover.git
  ROVER_UNITY_SIMULATION_COMMIT: 05e2b543fa76d8b6f7cbabf928351bc50bc7ca99

  ROS_TCP_ENDPOINT_REPO: https://github.com/Unity-Technologies/ROS-TCP-Endpoint.git
  ROS_TCP_ENDPOINT_COMMIT: 54c1a64b6d5ef6ffa0a0431570bb74329b79b15b

  SIMULATOR_URL: https://github.com/reeceholland/unity-ros2-rover-sim/releases/download/ci-sim-v0.1.0/ci-rover-linux-v0.1.0.tar.gz
  SIMULATOR_SHA256: 587ef502d1b419b6bfc80c832b74f4f99daee99fdf8526b8959e9cd702549630


jobs:
  headless-sim:
    name: Headless simulator dropout test

    runs-on: [self-hosted, linux, x64, ros2-jazzy]

    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECK OUT CURRENT FAULT-INJECTION FRAMEWORK
      # ============================================================

      - name: Checkout fault-injection framework
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false


      # ============================================================
      # 2. SET RUNNER-SPECIFIC PATHS
      # ============================================================

      - name: Set CI paths
        shell: bash
        run: |
          set -eo pipefail

          echo "UNITY_TESTS_DIR=$RUNNER_TEMP/unity-tests" >> "$GITHUB_ENV"
          echo "ROVER_WS=$RUNNER_TEMP/rover_ws" >> "$GITHUB_ENV"
          echo "SIMULATOR_DIR=$RUNNER_TEMP/ci-player" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$RUNNER_TEMP/test-logs" >> "$GITHUB_ENV"
          echo "CI_PLAYER=$RUNNER_TEMP/ci-player/CiRover.x86_64" >> "$GITHUB_ENV"


      - name: Show framework revision
        shell: bash
        run: |
          set -eo pipefail

          echo "Framework workspace: $FAULT_INJECTION_WS"
          echo "Framework commit:"
          git -C "$FAULT_INJECTION_WS" rev-parse HEAD

          echo
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub SHA: $GITHUB_SHA"


      # ============================================================
      # 3. VERIFY SELF-HOSTED RUNNER ENVIRONMENT
      # ============================================================

      - name: Verify build server environment
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          echo "Runner"
          echo "======"
          echo "Name: $RUNNER_NAME"
          uname -a

          echo
          echo "ROS distribution:"
          echo "$ROS_DISTRO"

          echo
          echo "ROS 2:"
          ros2 --help >/dev/null

          echo
          echo "ROS bag:"
          ros2 bag --help >/dev/null

          echo
          echo "colcon:"
          colcon --help >/dev/null

          echo
          echo "Build tools:"
          gcc --version | head -1
          cmake --version | head -1

          echo
          echo "Headless display:"
          command -v xvfb-run
          command -v Xvfb

          echo
          echo "Debugger:"
          gdb --version | head -1


      # ============================================================
      # 4. PREPARE CLEAN CI DIRECTORIES
      # ============================================================

      - name: Prepare CI directories
        shell: bash
        run: |
          set -eo pipefail

          rm -rf \
            "$UNITY_TESTS_DIR" \
            "$ROVER_WS" \
            "$SIMULATOR_DIR" \
            "$CI_LOG_DIR"

          mkdir -p \
            "$UNITY_TESTS_DIR" \
            "$ROVER_WS/src" \
            "$SIMULATOR_DIR" \
            "$CI_LOG_DIR"


      # ============================================================
      # 5. CHECK OUT PINNED UNITY TEST SCRIPTS
      # ============================================================

      - name: Checkout pinned Unity test scripts
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$UNITY_TESTS_DIR"

          git clone \
            --no-checkout \
            "$UNITY_TEST_REPO" \
            "$UNITY_TESTS_DIR"

          git -C "$UNITY_TESTS_DIR" \
            checkout --detach "$UNITY_TEST_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$UNITY_TESTS_DIR" rev-parse HEAD
          )"

          echo "Unity test repository:"
          echo "  $UNITY_TEST_REPO"

          echo
          echo "Pinned commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$UNITY_TEST_COMMIT" ]; then
            echo "ERROR: Unity checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 6. CHECK OUT PINNED ROVER PACKAGES
      # ============================================================

      - name: Checkout pinned rover packages
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$ROVER_WS/src/rover"

          git clone \
            --no-checkout \
            "$ROVER_REPO" \
            "$ROVER_WS/src/rover"

          git -C "$ROVER_WS/src/rover" \
            checkout --detach "$ROVER_UNITY_SIMULATION_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$ROVER_WS/src/rover" rev-parse HEAD
          )"

          echo "Rover repository:"
          echo "  $ROVER_REPO"

          echo
          echo "Pinned unity-simulation commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$ROVER_UNITY_SIMULATION_COMMIT" ]; then
            echo "ERROR: Rover checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 7. CHECK OUT PINNED ROS TCP ENDPOINT
      # ============================================================

      - name: Checkout pinned ROS TCP endpoint
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$ROVER_WS/src/ROS-TCP-Endpoint"

          git clone \
            --no-checkout \
            "$ROS_TCP_ENDPOINT_REPO" \
            "$ROVER_WS/src/ROS-TCP-Endpoint"

          git -C "$ROVER_WS/src/ROS-TCP-Endpoint" \
            checkout --detach "$ROS_TCP_ENDPOINT_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$ROVER_WS/src/ROS-TCP-Endpoint" rev-parse HEAD
          )"

          echo "ROS TCP Endpoint repository:"
          echo "  $ROS_TCP_ENDPOINT_REPO"

          echo
          echo "Pinned commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$ROS_TCP_ENDPOINT_COMMIT" ]; then
            echo "ERROR: ROS TCP Endpoint checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 8. UPDATE ROSDEP DATABASE
      # ============================================================

      - name: Update rosdep database
        shell: bash
        run: |
          set -eo pipefail

          rosdep update --rosdistro "$ROS_DISTRO"


      # ============================================================
      # 9. INSTALL ROVER DEPENDENCIES
      # ============================================================

      - name: Install rover dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          rosdep install \
            --from-paths "$ROVER_WS/src" \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y


      # ============================================================
      # 10. BUILD ROVER WORKSPACE
      # ============================================================

      - name: Build rover workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          cd "$ROVER_WS"

          colcon build \
            --symlink-install \
            --event-handlers console_direct+


      # ============================================================
      # 11. INSTALL FAULT-INJECTION DEPENDENCIES
      # ============================================================

      - name: Install fault-injection dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"

          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y


      # ============================================================
      # 12. BUILD CURRENT FAULT-INJECTION WORKSPACE
      # ============================================================

      - name: Build fault-injection workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"

          colcon build \
            --symlink-install \
            --event-handlers console_direct+


      # ============================================================
      # 13. DOWNLOAD PINNED SIMULATOR ARCHIVE
      # ============================================================

      - name: Download simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          rm -f "$ARCHIVE"

          echo "Downloading simulator:"
          echo "  $SIMULATOR_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output "$ARCHIVE" \
            "$SIMULATOR_URL"

          echo
          echo "Simulator archive downloaded:"
          ls -lh "$ARCHIVE"


      # ============================================================
      # 14. VERIFY SIMULATOR ARCHIVE
      # ============================================================

      - name: Verify simulator checksum
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          echo "$SIMULATOR_SHA256  $ARCHIVE" \
            | sha256sum --check -


      # ============================================================
      # 15. EXTRACT SIMULATOR
      # ============================================================

      - name: Extract simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          rm -rf "$SIMULATOR_DIR"
          mkdir -p "$SIMULATOR_DIR"

          bsdtar \
            -xf "$ARCHIVE" \
            -C "$SIMULATOR_DIR"

          if [ ! -f "$CI_PLAYER" ]; then
            echo "ERROR: Simulator executable was not found at:"
            echo "  $CI_PLAYER"

            echo
            echo "Extracted simulator contents:"

            find "$SIMULATOR_DIR" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$CI_PLAYER"

          echo
          echo "Simulator executable:"
          ls -lh "$CI_PLAYER"


      # ============================================================
      # 16. RUN HEADLESS TEST + RECORD ROS BAG
      # ============================================================

      - name: Run headless dropout test
        id: dropout
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          mkdir -p "$CI_LOG_DIR"

          TEST_SCRIPT="$UNITY_TESTS_DIR/tools/ci/run_headless_dropout.sh"
          ROSBAG_DIR="$CI_LOG_DIR/rosbag"

          if [ ! -f "$TEST_SCRIPT" ]; then
            echo "ERROR: Test script not found:"
            echo "  $TEST_SCRIPT"
            exit 1
          fi

          chmod +x "$TEST_SCRIPT"

          echo
          echo "CI configuration"
          echo "================"
          echo "Runner=$RUNNER_NAME"
          echo "CI_PLAYER=$CI_PLAYER"
          echo "ROVER_WS=$ROVER_WS"
          echo "FAULT_INJECTION_WS=$FAULT_INJECTION_WS"
          echo "CI_LOG_DIR=$CI_LOG_DIR"
          echo "ROSBAG_DIR=$ROSBAG_DIR"
          echo

          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START_EPOCH="$(date +%s)"

          # --------------------------------------------------------
          # Start ROS bag recorder before the simulator.
          #
          # It is OK if these topics do not exist immediately.
          # rosbag2 will subscribe as they become available.
          # --------------------------------------------------------

          ros2 bag record \
            -o "$ROSBAG_DIR" \
            /cmd_vel \
            /odom \
            /joint_states \
            /tf \
            /tf_static \
            > "$CI_LOG_DIR/rosbag.log" 2>&1 &

          BAG_PID=$!

          echo "ROS bag recorder PID: $BAG_PID"

          sleep 2

          # --------------------------------------------------------
          # Run Unity test while preserving stdout/stderr in a log.
          # --------------------------------------------------------

          set +e

          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=15s \
              180s \
              "$TEST_SCRIPT" \
            2>&1 | tee "$CI_LOG_DIR/dropout-test.log"

          TEST_STATUS=${PIPESTATUS[0]}

          set -e

          # --------------------------------------------------------
          # Stop ROS bag cleanly.
          # --------------------------------------------------------

          if kill -0 "$BAG_PID" 2>/dev/null; then
            echo
            echo "Stopping ROS bag recorder..."

            kill -INT "$BAG_PID" 2>/dev/null || true

            for i in $(seq 1 20); do
              if ! kill -0 "$BAG_PID" 2>/dev/null; then
                break
              fi
              sleep 0.5
            done

            if kill -0 "$BAG_PID" 2>/dev/null; then
              echo "ROS bag did not exit cleanly; terminating it."
              kill -TERM "$BAG_PID" 2>/dev/null || true
            fi

            wait "$BAG_PID" 2>/dev/null || true
          fi

          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          END_EPOCH="$(date +%s)"
          DURATION="$((END_EPOCH - START_EPOCH))"

          if [ "$TEST_STATUS" -eq 0 ]; then
            RESULT="pass"
          else
            RESULT="fail"
          fi

          # --------------------------------------------------------
          # Generate machine-readable test result.
          # --------------------------------------------------------

          export RESULT
          export TEST_STATUS
          export START_TIME
          export END_TIME
          export DURATION

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["CI_LOG_DIR"]) / "result.json"

          result = {
              "test": "headless_unity_dropout",
              "result": os.environ["RESULT"],
              "exit_code": int(os.environ["TEST_STATUS"]),
              "start_time_utc": os.environ["START_TIME"],
              "end_time_utc": os.environ["END_TIME"],
              "duration_s": int(os.environ["DURATION"]),
              "runner": os.environ.get("RUNNER_NAME"),
              "github": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              },
              "revisions": {
                  "unity_test": os.environ.get("UNITY_TEST_COMMIT"),
                  "rover": os.environ.get("ROVER_UNITY_SIMULATION_COMMIT"),
                  "ros_tcp_endpoint": os.environ.get("ROS_TCP_ENDPOINT_COMMIT"),
              },
              "artifacts": {
                  "dropout_log": "dropout-test.log",
                  "rosbag": "rosbag",
                  "rosbag_log": "rosbag.log",
              },
          }

          output.write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )

          print(output.read_text())
          PY

          echo
          echo "Test exit status: $TEST_STATUS"
          echo "Duration: ${DURATION}s"
          echo "Result: $RESULT"

          exit "$TEST_STATUS"


      # ============================================================
      # 17. CAPTURE NATIVE CRASH DIAGNOSTICS ON FAILURE
      # ============================================================

      - name: Capture Unity native backtrace
        if: ${{ failure() && steps.dropout.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$CI_LOG_DIR"

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          status=0

          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=10s \
              60s \
              gdb --batch --quiet \
                -ex 'set pagination off' \
                -ex 'set confirm off' \
                -ex 'set debuginfod enabled off' \
                -ex 'handle SIGPIPE nostop noprint pass' \
                -ex 'handle SIGXCPU SIG33 SIG35 SIG36 SIG37 SIG38 SIGPWR nostop noprint pass' \
                -ex 'handle SIGSEGV stop print nopass' \
                -ex 'run' \
                -ex 'thread apply all bt full' \
                -ex 'info sharedlibrary' \
                -ex 'info registers' \
                -ex 'x/16i $pc-16' \
                -ex 'info proc mappings' \
                --args "$CI_PLAYER" \
                  -batchmode \
                  -nographics \
                  -logFile "$CI_LOG_DIR/unity-gdb.log" \
              > "$CI_LOG_DIR/unity-backtrace.log" 2>&1 \
            || status=$?

          printf '\nDiagnostic exit status: %s (124 means timeout)\n' "$status" \
            >> "$CI_LOG_DIR/unity-backtrace.log"

          cat "$CI_LOG_DIR/unity-backtrace.log"


      # ============================================================
      # 18. WRITE GITHUB ACTIONS SUMMARY
      # ============================================================

      - name: Write test summary
        if: always()
        shell: bash
        env:
          DROPOUT_OUTCOME: ${{ steps.dropout.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          result_path = Path(os.environ["CI_LOG_DIR"]) / "result.json"

          lines = [
              "# Headless Unity Fault-Injection Test",
              "",
          ]

          if result_path.exists():
              data = json.loads(result_path.read_text())

              passed = data.get("result") == "pass"
              icon = "✅" if passed else "❌"

              lines.extend([
                  f"## {icon} Result: {data.get('result', 'unknown').upper()}",
                  "",
                  "| Property | Value |",
                  "|---|---|",
                  f"| Runner | `{data.get('runner')}` |",
                  f"| Duration | {data.get('duration_s')} s |",
                  f"| Exit code | `{data.get('exit_code')}` |",
                  f"| Commit | `{data.get('github', {}).get('sha')}` |",
                  f"| Rover revision | `{data.get('revisions', {}).get('rover')}` |",
                  f"| Unity test revision | `{data.get('revisions', {}).get('unity_test')}` |",
                  "",
                  "## Captured diagnostics",
                  "",
                  "- ROS 2 bag",
                  "- Dropout test console log",
                  "- rosbag recorder log",
                  "- Structured `result.json`",
              ])

              if not passed:
                  lines.extend([
                      "- Unity native GDB backtrace, when available",
                  ])

          else:
              lines.extend([
                  "## ❌ Test did not reach the simulation stage",
                  "",
                  f"- Job status: `{os.environ.get('JOB_STATUS')}`",
                  f"- Dropout step: `{os.environ.get('DROPOUT_OUTCOME')}`",
                  "",
                  "Inspect the workflow logs for the setup/build failure.",
              ])

          summary.write_text("\n".join(lines) + "\n")
          PY


      # ============================================================
      # 19. SHOW CAPTURED ARTIFACTS
      # ============================================================

      - name: Show test artifacts
        if: always()
        shell: bash
        run: |
          echo "Captured test files:"
          echo

          if [ -d "$CI_LOG_DIR" ]; then
            find "$CI_LOG_DIR" \
              -maxdepth 3 \
              -type f \
              -printf '%p  %k KB\n' \
              | sort
          else
            echo "No CI log directory was created."
          fi


      # ============================================================
      # 20. ALWAYS UPLOAD LOGS AND ROS BAG
      # ============================================================

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-sim-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

          path: |
            ${{ runner.temp }}/test-logs
            ${{ runner.temp }}/rover_ws/log
            ${{ github.workspace }}/log