name: Headless Unity fault-injection test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DISTRO: jazzy

  # Current fault-injection checkout.
  # Deliberately NOT pinned.
  FAULT_INJECTION_WS: ${{ github.workspace }}

  # ------------------------------------------------------------
  # PINNED EXTERNAL DEPENDENCIES
  # ------------------------------------------------------------

  UNITY_TEST_REPO: https://github.com/reeceholland/unity-ros2-rover-sim.git
  UNITY_TEST_COMMIT: fe2a5bf2fb2f3910f94695750340051726605150

  ROVER_REPO: https://github.com/reeceholland/rugged_rover.git
  ROVER_UNITY_SIMULATION_COMMIT: 05e2b543fa76d8b6f7cbabf928351bc50bc7ca99

  ROS_TCP_ENDPOINT_REPO: https://github.com/Unity-Technologies/ROS-TCP-Endpoint.git
  ROS_TCP_ENDPOINT_COMMIT: 54c1a64b6d5ef6ffa0a0431570bb74329b79b15b

  SIMULATOR_URL: https://github.com/reeceholland/unity-ros2-rover-sim/releases/download/ci-sim-v0.1.0/ci-rover-linux-v0.1.0.tar.gz

  SIMULATOR_SHA256: 587ef502d1b419b6bfc80c832b74f4f99daee99fdf8526b8959e9cd702549630


jobs:
  headless-sim:
    name: Headless simulator dropout test

    # This job now runs on the Proxmox Ubuntu build server.
    runs-on: [self-hosted, linux, x64, ros2-jazzy]

    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECK OUT CURRENT FAULT-INJECTION FRAMEWORK
      # ============================================================

      - name: Checkout fault-injection framework
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false


      # ============================================================
      # 2. SET RUNNER-SPECIFIC PATHS
      # ============================================================

      - name: Set CI paths
        shell: bash
        run: |
          set -eo pipefail

          echo "UNITY_TESTS_DIR=$RUNNER_TEMP/unity-tests" >> "$GITHUB_ENV"
          echo "ROVER_WS=$RUNNER_TEMP/rover_ws" >> "$GITHUB_ENV"
          echo "SIMULATOR_DIR=$RUNNER_TEMP/ci-player" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$RUNNER_TEMP/test-logs" >> "$GITHUB_ENV"
          echo "CI_PLAYER=$RUNNER_TEMP/ci-player/CiRover.x86_64" >> "$GITHUB_ENV"


      - name: Show framework revision
        shell: bash
        run: |
          set -eo pipefail

          echo "Framework workspace: $FAULT_INJECTION_WS"
          echo "Framework commit:"
          git -C "$FAULT_INJECTION_WS" rev-parse HEAD

          echo
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub SHA: $GITHUB_SHA"


      # ============================================================
      # 3. VERIFY SELF-HOSTED RUNNER ENVIRONMENT
      # ============================================================

      # ROS 2 Jazzy and the build/headless packages are installed
      # permanently on the Proxmox build-server VM.
      - name: Verify build server environment
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          echo "Runner:"
          uname -a

          echo
          echo "ROS distribution:"
          echo "$ROS_DISTRO"

          echo
          echo "ROS 2:"
          ros2 --help >/dev/null

          echo
          echo "colcon:"
          colcon --help >/dev/null

          echo
          echo "Build tools:"
          gcc --version | head -1
          cmake --version | head -1

          echo
          echo "Headless display:"
          command -v xvfb-run
          command -v Xvfb

          echo
          echo "Debugger:"
          gdb --version | head -1


      # ============================================================
      # 4. PREPARE CLEAN CI DIRECTORIES
      # ============================================================

      - name: Prepare CI directories
        shell: bash
        run: |
          set -eo pipefail

          rm -rf \
            "$UNITY_TESTS_DIR" \
            "$ROVER_WS" \
            "$SIMULATOR_DIR" \
            "$CI_LOG_DIR"

          mkdir -p \
            "$UNITY_TESTS_DIR" \
            "$ROVER_WS/src" \
            "$SIMULATOR_DIR" \
            "$CI_LOG_DIR"


      # ============================================================
      # 5. CHECK OUT PINNED UNITY TEST SCRIPTS
      # ============================================================

      - name: Checkout pinned Unity test scripts
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$UNITY_TESTS_DIR"

          git clone \
            --no-checkout \
            "$UNITY_TEST_REPO" \
            "$UNITY_TESTS_DIR"

          git -C "$UNITY_TESTS_DIR" \
            checkout --detach "$UNITY_TEST_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$UNITY_TESTS_DIR" rev-parse HEAD
          )"

          echo "Unity test repository:"
          echo "  $UNITY_TEST_REPO"

          echo
          echo "Pinned commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$UNITY_TEST_COMMIT" ]; then
            echo "ERROR: Unity checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 6. CHECK OUT PINNED ROVER PACKAGES
      # ============================================================

      - name: Checkout pinned rover packages
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$ROVER_WS/src/rover"

          git clone \
            --no-checkout \
            "$ROVER_REPO" \
            "$ROVER_WS/src/rover"

          git -C "$ROVER_WS/src/rover" \
            checkout --detach "$ROVER_UNITY_SIMULATION_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$ROVER_WS/src/rover" rev-parse HEAD
          )"

          echo "Rover repository:"
          echo "  $ROVER_REPO"

          echo
          echo "Pinned unity-simulation commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$ROVER_UNITY_SIMULATION_COMMIT" ]; then
            echo "ERROR: Rover checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 7. CHECK OUT PINNED ROS TCP ENDPOINT
      # ============================================================

      # unity_sim.launch.py requires this separate source package.
      - name: Checkout pinned ROS TCP endpoint
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$ROVER_WS/src/ROS-TCP-Endpoint"

          git clone \
            --no-checkout \
            "$ROS_TCP_ENDPOINT_REPO" \
            "$ROVER_WS/src/ROS-TCP-Endpoint"

          git -C "$ROVER_WS/src/ROS-TCP-Endpoint" \
            checkout --detach "$ROS_TCP_ENDPOINT_COMMIT"

          ACTUAL_COMMIT="$(
            git -C "$ROVER_WS/src/ROS-TCP-Endpoint" rev-parse HEAD
          )"

          echo "ROS TCP Endpoint repository:"
          echo "  $ROS_TCP_ENDPOINT_REPO"

          echo
          echo "Pinned commit:"
          echo "  $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$ROS_TCP_ENDPOINT_COMMIT" ]; then
            echo "ERROR: ROS TCP Endpoint checkout does not match pinned commit"
            exit 1
          fi


      # ============================================================
      # 8. UPDATE ROSDEP DATABASE
      # ============================================================

      # rosdep has already been initialized on the persistent runner.
      - name: Update rosdep database
        shell: bash
        run: |
          set -eo pipefail

          rosdep update --rosdistro "$ROS_DISTRO"


      # ============================================================
      # 9. INSTALL ROVER DEPENDENCIES
      # ============================================================

      - name: Install rover dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          rosdep install \
            --from-paths "$ROVER_WS/src" \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y


      # ============================================================
      # 10. BUILD ROVER WORKSPACE
      # ============================================================

      - name: Build rover workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash

          cd "$ROVER_WS"

          colcon build \
            --symlink-install \
            --event-handlers console_direct+


      # ============================================================
      # 11. INSTALL FAULT-INJECTION DEPENDENCIES
      # ============================================================

      - name: Install fault-injection dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"

          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y


      # ============================================================
      # 12. BUILD CURRENT FAULT-INJECTION WORKSPACE
      # ============================================================

      - name: Build fault-injection workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"

          colcon build \
            --symlink-install \
            --event-handlers console_direct+


      # ============================================================
      # 13. DOWNLOAD PINNED SIMULATOR ARCHIVE
      # ============================================================

      - name: Download simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          rm -f "$ARCHIVE"

          echo "Downloading simulator:"
          echo "  $SIMULATOR_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output "$ARCHIVE" \
            "$SIMULATOR_URL"

          echo
          echo "Simulator archive downloaded:"
          ls -lh "$ARCHIVE"


      # ============================================================
      # 14. VERIFY SIMULATOR ARCHIVE
      # ============================================================

      - name: Verify simulator checksum
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          echo "$SIMULATOR_SHA256  $ARCHIVE" \
            | sha256sum --check -


      # ============================================================
      # 15. EXTRACT SIMULATOR
      # ============================================================

      - name: Extract simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator"

          rm -rf "$SIMULATOR_DIR"
          mkdir -p "$SIMULATOR_DIR"

          bsdtar \
            -xf "$ARCHIVE" \
            -C "$SIMULATOR_DIR"

          if [ ! -f "$CI_PLAYER" ]; then
            echo "ERROR: Simulator executable was not found at:"
            echo "  $CI_PLAYER"

            echo
            echo "Extracted simulator contents:"

            find "$SIMULATOR_DIR" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$CI_PLAYER"

          echo
          echo "Simulator executable:"
          ls -lh "$CI_PLAYER"


      # ============================================================
      # 16. RUN HEADLESS DROPOUT TEST
      # ============================================================

      - name: Run headless dropout test
        id: dropout
        timeout-minutes: 5
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          mkdir -p "$CI_LOG_DIR"

          echo
          echo "CI configuration"
          echo "================"
          echo "CI_PLAYER=$CI_PLAYER"
          echo "ROVER_WS=$ROVER_WS"
          echo "FAULT_INJECTION_WS=$FAULT_INJECTION_WS"
          echo "CI_LOG_DIR=$CI_LOG_DIR"
          echo

          TEST_SCRIPT="$UNITY_TESTS_DIR/tools/ci/run_headless_dropout.sh"

          if [ ! -f "$TEST_SCRIPT" ]; then
            echo "ERROR: Test script not found:"
            echo "  $TEST_SCRIPT"

            echo
            echo "Available CI files:"

            find "$UNITY_TESTS_DIR/tools/ci" \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1
          fi

          chmod +x "$TEST_SCRIPT"

          # Unity still queries the window backend with -nographics.
          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=15s \
              180s \
              "$TEST_SCRIPT"


      # ============================================================
      # 17. CAPTURE NATIVE CRASH DIAGNOSTICS ON FAILURE
      # ============================================================

      # Reproduce startup under GDB only after the normal test fails.
      # Keep the original test failure and logs intact.
      - name: Capture Unity native backtrace
        if: ${{ failure() && steps.dropout.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$CI_LOG_DIR"

          source /opt/ros/jazzy/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          # A healthy player keeps running; bound this diagnostic retry.
          status=0

          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=10s \
              60s \
              gdb --batch --quiet \
                -ex 'set pagination off' \
                -ex 'set confirm off' \
                -ex 'set debuginfod enabled off' \
                -ex 'handle SIGPIPE nostop noprint pass' \
                -ex 'handle SIGXCPU SIG33 SIG35 SIG36 SIG37 SIG38 SIGPWR nostop noprint pass' \
                -ex 'handle SIGSEGV stop print nopass' \
                -ex 'run' \
                -ex 'thread apply all bt full' \
                -ex 'info sharedlibrary' \
                -ex 'info registers' \
                -ex 'x/16i $pc-16' \
                -ex 'info proc mappings' \
                --args "$CI_PLAYER" \
                  -batchmode \
                  -nographics \
                  -logFile "$CI_LOG_DIR/unity-gdb.log" \
              > "$CI_LOG_DIR/unity-backtrace.log" 2>&1 \
            || status=$?

          printf '\nDiagnostic exit status: %s (124 means timeout)\n' "$status" \
            >> "$CI_LOG_DIR/unity-backtrace.log"

          cat "$CI_LOG_DIR/unity-backtrace.log"


      # ============================================================
      # 18. ALWAYS UPLOAD LOGS
      # ============================================================

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-sim-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

          path: |
            ${{ runner.temp }}/test-logs
            ${{ runner.temp }}/rover_ws/log
            ${{ github.workspace }}/log