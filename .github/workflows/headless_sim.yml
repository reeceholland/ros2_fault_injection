name: Headless Unity fault-injection test

on:
  workflow_dispatch:
    inputs:
      unity_test_commit:
        description: 'Published 40-character Unity commit whose CI runner enables use_motor_fault_injection'
        required: true
        type: string
      rover_commit:
        description: 'Published 40-character rover commit with Unity Nav2/SLAM and simulation-time fixes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: headless-unity-fault-injection
  cancel-in-progress: false

env:
  ROS_DISTRO: jazzy
  ROS_DOMAIN_ID: "190"
  CI_ROS_DOMAIN_ID: "190"
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST

  FAULT_INJECTION_WS: ${{ github.workspace }}

  UNITY_TEST_REPO: https://github.com/reeceholland/unity-ros2-rover-sim.git
  UNITY_TEST_COMMIT: f664404d88faaefa8ff85431ad835ef48e3b343b

  ROVER_REPO: https://github.com/reeceholland/rugged_rover.git
  ROVER_UNITY_SIMULATION_COMMIT: d34e8309d127f38a51094a3d88c967d85dbdb307

  ROS_TCP_ENDPOINT_REPO: https://github.com/Unity-Technologies/ROS-TCP-Endpoint.git
  ROS_TCP_ENDPOINT_COMMIT: 54c1a64b6d5ef6ffa0a0431570bb74329b79b15b

  SIMULATOR_URL: https://github.com/reeceholland/unity-ros2-rover-sim/releases/download/ci-sim-v0.1.1/ci-rover-linux-ci-sim-v0.1.1.tar.gz
  SIMULATOR_SHA256: f05d9191fbf28f7035b4594ccf90a71e7218aaec3bb712843abe2029cf267bec

jobs:
  headless-sim:
    name: Headless simulator dropout and navigation tests
    runs-on: [self-hosted, linux, x64, ros2-jazzy]
    timeout-minutes: 60

    steps:
      - name: Checkout fault-injection framework
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set CI paths
        shell: bash
        run: |
          set -eo pipefail

          echo "UNITY_TESTS_DIR=$RUNNER_TEMP/unity-tests" >> "$GITHUB_ENV"
          echo "ROVER_WS=$RUNNER_TEMP/rover_ws" >> "$GITHUB_ENV"
          echo "SIMULATOR_DIR=$RUNNER_TEMP/ci-player" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$RUNNER_TEMP/test-logs" >> "$GITHUB_ENV"
          echo "CI_PLAYER=$RUNNER_TEMP/ci-player/CiRover.x86_64" >> "$GITHUB_ENV"

      - name: Verify build server environment
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash

          echo "Runner: $RUNNER_NAME"
          echo "ROS_DISTRO=$ROS_DISTRO"
          echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID"
          uname -a

          ros2 --help >/dev/null
          ros2 bag --help >/dev/null
          colcon --help >/dev/null
          gcc --version | head -1
          cmake --version | head -1
          command -v xvfb-run
          command -v Xvfb
          command -v gdb
          command -v bsdtar
          command -v flock
          command -v ss
          command -v setsid
          [[ "$UNITY_TEST_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "unity_test_commit must be a published full lowercase commit SHA" >&2
            exit 2
          }
          [[ "$ROVER_UNITY_SIMULATION_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "rover_commit must be a published full lowercase commit SHA" >&2
            exit 2
          }

      - name: Prepare CI directories
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$UNITY_TESTS_DIR" "$ROVER_WS" "$SIMULATOR_DIR" "$CI_LOG_DIR"
          mkdir -p "$UNITY_TESTS_DIR" "$ROVER_WS/src" "$SIMULATOR_DIR" "$CI_LOG_DIR"

      - name: Checkout pinned Unity test scripts
        shell: bash
        run: |
          set -eo pipefail

          git clone --no-checkout "$UNITY_TEST_REPO" "$UNITY_TESTS_DIR"
          git -C "$UNITY_TESTS_DIR" checkout --detach "$UNITY_TEST_COMMIT"

          ACTUAL_COMMIT="$(git -C "$UNITY_TESTS_DIR" rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$UNITY_TEST_COMMIT"

      - name: Checkout pinned rover packages
        shell: bash
        run: |
          set -eo pipefail

          git clone --no-checkout "$ROVER_REPO" "$ROVER_WS/src/rover"
          git -C "$ROVER_WS/src/rover" checkout --detach "$ROVER_UNITY_SIMULATION_COMMIT"

          ACTUAL_COMMIT="$(git -C "$ROVER_WS/src/rover" rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$ROVER_UNITY_SIMULATION_COMMIT"

      - name: Check navigation launch compatibility
        shell: bash
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          launch = Path(os.environ['ROVER_WS']) / 'src/rover/rugged_rover_bringup/launch/unity_sim.launch.py'
          runner = Path(os.environ['UNITY_TESTS_DIR']) / 'tools/ci/run_headless.sh'
          if 'use_motor_fault_injection:=true' not in runner.read_text():
              raise SystemExit('Selected Unity commit must explicitly enable motor fault injection in its CI runner.')
          text = launch.read_text()
          missing = [name for name in ('use_nav2', 'use_slam', 'ros_tcp_ip', 'use_motor_fault_injection') if name not in text]
          if missing:
              raise SystemExit(f"Selected rover commit lacks required Unity launch options: {missing}. Publish the updated rover launch code first.")
          PY
          python3 -m unittest discover -s "$UNITY_TESTS_DIR/tools/ci" -p test_navigation_scenario.py

      - name: Checkout pinned ROS TCP endpoint
        shell: bash
        run: |
          set -eo pipefail

          git clone --no-checkout "$ROS_TCP_ENDPOINT_REPO" "$ROVER_WS/src/ROS-TCP-Endpoint"
          git -C "$ROVER_WS/src/ROS-TCP-Endpoint" checkout --detach "$ROS_TCP_ENDPOINT_COMMIT"

          ACTUAL_COMMIT="$(git -C "$ROVER_WS/src/ROS-TCP-Endpoint" rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$ROS_TCP_ENDPOINT_COMMIT"

      - name: Update rosdep database
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash
          rosdep update --rosdistro "$ROS_DISTRO"

      - name: Install rover dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash

          rosdep install \
            --from-paths "$ROVER_WS/src" \
            --ignore-src \
            --rosdistro "$ROS_DISTRO" \
            -r \
            -y

      - name: Build rover workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash

          cd "$ROVER_WS"
          colcon build --symlink-install --event-handlers console_direct+

      - name: Install fault-injection dependencies
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"

          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro "$ROS_DISTRO" \
            -r \
            -y

      - name: Build fault-injection workspace
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash
          source "$ROVER_WS/install/setup.bash"

          cd "$FAULT_INJECTION_WS"
          colcon build --symlink-install --event-handlers console_direct+

      - name: Download simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator.tar.gz"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output "$ARCHIVE" \
            "$SIMULATOR_URL"

          echo "$SIMULATOR_SHA256  $ARCHIVE" | sha256sum --check -

      - name: Extract simulator
        shell: bash
        run: |
          set -eo pipefail

          ARCHIVE="$RUNNER_TEMP/CiRover-simulator.tar.gz"

          rm -rf "$SIMULATOR_DIR"
          mkdir -p "$SIMULATOR_DIR"

          bsdtar -xf "$ARCHIVE" -C "$SIMULATOR_DIR"

          if [ ! -f "$CI_PLAYER" ]; then
            echo "ERROR: Simulator executable was not found at $CI_PLAYER"
            find "$SIMULATOR_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          chmod +x "$CI_PLAYER"

      - name: Run headless dropout test
        id: dropout
        timeout-minutes: 5
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/"$ROS_DISTRO"/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          mkdir -p "$CI_LOG_DIR"

          TEST_SCRIPT="$UNITY_TESTS_DIR/tools/ci/run_headless_dropout.sh"
          ROSBAG_DIR="$CI_LOG_DIR/rosbag"
          BAG_PID=""
          unset ROS_STATIC_PEERS ROS_DISCOVERY_SERVER FASTRTPS_DEFAULT_PROFILES_FILE FASTDDS_DEFAULT_PROFILES_FILE CYCLONEDDS_URI ROS_LOCALHOST_ONLY

          cleanup() {
            set +e

            if [ -n "${BAG_PID:-}" ] && kill -0 "$BAG_PID" 2>/dev/null; then
              echo "Stopping ROS bag recorder..."
              kill -INT "$BAG_PID" 2>/dev/null || true

              for _ in $(seq 1 20); do
                kill -0 "$BAG_PID" 2>/dev/null || break
                sleep 0.5
              done

              kill -0 "$BAG_PID" 2>/dev/null && kill -TERM "$BAG_PID" 2>/dev/null || true
              wait "$BAG_PID" 2>/dev/null || true
            fi

            pkill -P $$ 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          {
            echo "CI configuration"
            echo "================"
            echo "Runner=$RUNNER_NAME"
            echo "ROS_DISTRO=$ROS_DISTRO"
            echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID"
            echo "CI_PLAYER=$CI_PLAYER"
            echo "ROVER_WS=$ROVER_WS"
            echo "FAULT_INJECTION_WS=$FAULT_INJECTION_WS"
            echo "CI_LOG_DIR=$CI_LOG_DIR"
            echo "ROSBAG_DIR=$ROSBAG_DIR"
            echo "TEST_SCRIPT=$TEST_SCRIPT"
          } | tee "$CI_LOG_DIR/preflight.log"

          if [ ! -f "$TEST_SCRIPT" ]; then
            echo "ERROR: Test script not found: $TEST_SCRIPT" | tee -a "$CI_LOG_DIR/preflight.log"
            find "$UNITY_TESTS_DIR/tools/ci" -maxdepth 2 -type f -print || true
            exit 1
          fi

          chmod +x "$TEST_SCRIPT"

          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START_EPOCH="$(date +%s)"

          ros2 bag record \
            -o "$ROSBAG_DIR" \
            /scan_raw \
            /ci/scan \
            /cmd_vel \
            /odom \
            /joint_states \
            /tf \
            /tf_static \
            > "$CI_LOG_DIR/rosbag.log" 2>&1 &

          BAG_PID=$!
          echo "ROS bag recorder PID: $BAG_PID"

          sleep 2

          if ! kill -0 "$BAG_PID" 2>/dev/null; then
            echo "ERROR: rosbag2 exited before the simulation started."
            cat "$CI_LOG_DIR/rosbag.log" || true
            exit 1
          fi

          set +e

          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=15s \
              180s \
              bash "$TEST_SCRIPT" \
            > >(tee "$CI_LOG_DIR/dropout-test.log") \
            2> >(tee "$CI_LOG_DIR/dropout-test-stderr.log" >&2)

          TEST_STATUS=$?

          set -e

          cleanup
          trap - EXIT INT TERM

          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          END_EPOCH="$(date +%s)"
          DURATION="$((END_EPOCH - START_EPOCH))"

          if [ "$TEST_STATUS" -eq 0 ]; then
            RESULT="pass"
          else
            RESULT="fail"
          fi

          {
            echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID"
            echo
            echo "Topics visible after test:"
            ros2 topic list 2>&1 || true
            echo
            echo "Nodes visible after test:"
            ros2 node list 2>&1 || true
          } > "$CI_LOG_DIR/ros-state-after-test.log"

          export RESULT TEST_STATUS START_TIME END_TIME DURATION

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          log_dir = Path(os.environ["CI_LOG_DIR"])
          bag_dir = log_dir / "rosbag"
          metadata = bag_dir / "metadata.yaml"
          output = log_dir / "result.json"

          result = {
              "test": "headless_unity_dropout",
              "result": os.environ["RESULT"],
              "exit_code": int(os.environ["TEST_STATUS"]),
              "start_time_utc": os.environ["START_TIME"],
              "end_time_utc": os.environ["END_TIME"],
              "duration_s": int(os.environ["DURATION"]),
              "runner": os.environ.get("RUNNER_NAME"),
              "ros": {
                  "distribution": os.environ.get("ROS_DISTRO"),
                  "domain_id": os.environ.get("ROS_DOMAIN_ID"),
              },
              "github": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              },
              "revisions": {
                  "unity_test": os.environ.get("UNITY_TEST_COMMIT"),
                  "rover": os.environ.get("ROVER_UNITY_SIMULATION_COMMIT"),
                  "ros_tcp_endpoint": os.environ.get("ROS_TCP_ENDPOINT_COMMIT"),
              },
              "artifacts": {
                  "preflight_log": "preflight.log",
                  "dropout_stdout": "dropout-test.log",
                  "dropout_stderr": "dropout-test-stderr.log",
                  "rosbag_log": "rosbag.log",
                  "rosbag_present": metadata.exists(),
                  "rosbag_metadata": "rosbag/metadata.yaml" if metadata.exists() else None,
                  "rosbag": "rosbag",
                  "ros_state": "ros-state-after-test.log",
              },
          }

          output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(output.read_text())
          PY

          {
            echo "Result: $RESULT"
            echo "Exit code: $TEST_STATUS"
            echo "Duration: ${DURATION}s"
            echo "ROS_DOMAIN_ID: $ROS_DOMAIN_ID"
          } > "$CI_LOG_DIR/test-status.txt"

          echo "Headless dropout test completed"
          echo "Result: $RESULT"
          echo "Exit status: $TEST_STATUS"
          echo "Duration: ${DURATION}s"

          exit "$TEST_STATUS"

      - name: Run headless waypoint navigation with fault injection
        id: navigation
        timeout-minutes: 17
        shell: bash
        run: |
          bash tools/ci/run_navigation_workflow.sh

      - name: Capture Unity native backtrace
        if: ${{ failure() && (steps.dropout.outcome == 'failure' || steps.navigation.outcome == 'failure') }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$CI_LOG_DIR"

          source /opt/ros/"$ROS_DISTRO"/setup.bash
          source "$ROVER_WS/install/setup.bash"
          source "$FAULT_INJECTION_WS/install/setup.bash"

          status=0

          xvfb-run -a \
            timeout \
              --signal=TERM \
              --kill-after=10s \
              60s \
              gdb --batch --quiet \
                -ex 'set pagination off' \
                -ex 'set confirm off' \
                -ex 'set debuginfod enabled off' \
                -ex 'handle SIGPIPE nostop noprint pass' \
                -ex 'handle SIGXCPU SIG33 SIG35 SIG36 SIG37 SIG38 SIGPWR nostop noprint pass' \
                -ex 'handle SIGSEGV stop print nopass' \
                -ex 'run' \
                -ex 'thread apply all bt full' \
                -ex 'info sharedlibrary' \
                -ex 'info registers' \
                -ex 'x/16i $pc-16' \
                -ex 'info proc mappings' \
                --args "$CI_PLAYER" \
                  -batchmode \
                  -nographics \
                  -logFile "$CI_LOG_DIR/unity-gdb.log" \
              > "$CI_LOG_DIR/unity-backtrace.log" 2>&1 \
            || status=$?

          {
            echo
            echo "Diagnostic exit status: $status"
            echo "124 means the healthy Unity process reached the diagnostic timeout."
            echo
            echo "NOTE:"
            echo "This diagnostic launches Unity without the complete ROS endpoint."
            echo "Connection-refused messages on port 10000 are therefore not"
            echo "by themselves evidence of the original test failure."
          } >> "$CI_LOG_DIR/unity-backtrace.log"

          cat "$CI_LOG_DIR/unity-backtrace.log"

      - name: Write test summary
        if: always()
        shell: bash
        env:
          DROPOUT_OUTCOME: ${{ steps.dropout.outcome }}
          NAVIGATION_OUTCOME: ${{ steps.navigation.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          result_path = Path(os.environ["CI_LOG_DIR"]) / "result.json"

          lines = [
              "# Headless Unity Fault-Injection Test",
              "",
          ]

          if result_path.exists():
              data = json.loads(result_path.read_text())
              passed = data.get("result") == "pass"
              icon = "✅" if passed else "❌"

              lines.extend([
                  f"## {icon} Dropout result: {data.get('result', 'unknown').upper()}",
                  "",
                  "| Property | Value |",
                  "|---|---|",
                  f"| Runner | `{data.get('runner')}` |",
                  f"| Duration | {data.get('duration_s')} s |",
                  f"| Exit code | `{data.get('exit_code')}` |",
                  f"| ROS distribution | `{data.get('ros', {}).get('distribution')}` |",
                  f"| ROS domain | `{data.get('ros', {}).get('domain_id')}` |",
                  f"| Framework commit | `{data.get('github', {}).get('sha')}` |",
                  f"| Rover revision | `{data.get('revisions', {}).get('rover')}` |",
                  f"| Unity test revision | `{data.get('revisions', {}).get('unity_test')}` |",
                  f"| ROS bag present | `{data.get('artifacts', {}).get('rosbag_present')}` |",
                  "",
                  "## Captured diagnostics",
                  "",
                  "- `result.json`",
                  "- `test-status.txt`",
                  "- `preflight.log`",
                  "- `dropout-test.log`",
                  "- `dropout-test-stderr.log`",
                  "- `rosbag.log`",
                  "- ROS 2 bag directory",
                  "- `ros-state-after-test.log`",
              ])

              if not passed:
                  lines.append("- Unity native GDB diagnostic")
          else:
              lines.extend([
                  "## ❌ Test did not produce a structured result",
                  "",
                  f"- Job status: `{os.environ.get('JOB_STATUS')}`",
                  f"- Dropout step: `{os.environ.get('DROPOUT_OUTCOME')}`",
                  "",
                  "The workflow failed before `result.json` could be created.",
              ])

          lines.extend(["", "## Navigation", "", f"Step outcome: `{os.environ.get('NAVIGATION_OUTCOME')}`", ""])
          navigation = Path(os.environ['CI_LOG_DIR']) / 'navigation/results.json'
          if navigation.exists():
              data = json.loads(navigation.read_text())
              lines.extend([f"Scenario passed: `{data.get('passed')}`", "",
                            "| Goal | Passed | Position error (m) | Yaw error (deg) |",
                            "|---|---|---|---|"])
              for goal in data.get('goals', []):
                  lines.append(f"| {goal['name']} | {goal['passed']} | {goal.get('position_error', '-')} | {goal.get('yaw_error_deg', '-')} |")
              lines.extend(["", "Navigation artifacts: `navigation/results.json`, `navigation/junit.xml`, logs and ROS bag."])
          else:
              lines.append("No navigation report: inspect step outcome and logs for setup failure, timeout or skipped navigation.")
          summary.write_text("\n".join(lines) + "\n")
          PY

      - name: Show test artifacts
        if: always()
        shell: bash
        run: |
          echo "Captured test files:"
          echo

          if [ -d "$CI_LOG_DIR" ]; then
            find "$CI_LOG_DIR" \
              -maxdepth 4 \
              -type f \
              -printf '%p  %k KB\n' \
              | sort
          else
            echo "No CI log directory was created."
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-sim-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/test-logs
            ${{ runner.temp }}/rover_ws/log
            ${{ github.workspace }}/log